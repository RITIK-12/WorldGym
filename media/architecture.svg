<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Helvetica, Arial, sans-serif"><rect width="1600" height="760" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#202124"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#202124"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#A5D8FF" stroke-width="2.5"/></pattern></defs><rect x="500.0" y="50.0" width="600" height="120" rx="16" fill="#A5D8FF" stroke="#1971C2" stroke-width="2.2"/><text x="800" y="94" text-anchor="middle" font-size="24" font-weight="600" fill="#202124">Orchestrator</text><text x="800" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">runs the three phases, checks each agent's typed output,</text><text x="800" y="138" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">keeps a fix only if the score improves</text><rect x="100.0" y="302.0" width="400" height="136" rx="16" fill="#E5DBFF" stroke="#7048E8" stroke-width="2.2"/><text x="300" y="343" text-anchor="middle" font-size="21" font-weight="600" fill="#202124">Phase 1: Video Architect</text><text x="300" y="365" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">Gemini 4 Argon, one call</text><text x="300" y="387" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">robot, objects, assets, layout,</text><text x="300" y="409" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">what each arm does</text><rect x="600.0" y="302.0" width="400" height="136" rx="16" fill="#E5DBFF" stroke="#7048E8" stroke-width="2.2"/><text x="800" y="343" text-anchor="middle" font-size="21" font-weight="600" fill="#202124">Phase 2: Labelling swarm</text><text x="800" y="365" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">Gemini Robotics-ER 2</text><text x="800" y="387" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">gripper points and object boxes</text><text x="800" y="409" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">for every frame, in parallel</text><rect x="1100.0" y="302.0" width="400" height="136" rx="16" fill="#E5DBFF" stroke="#7048E8" stroke-width="2.2"/><text x="1300" y="343" text-anchor="middle" font-size="21" font-weight="600" fill="#202124">Phase 3: Four-view Critic</text><text x="1300" y="365" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">Gemini 4 Argon</text><text x="1300" y="387" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">watches the clip next to 4 views</text><text x="1300" y="409" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">of the simulation, patches it</text><path d="M800,172 V240 M300,240 H1300" fill="none" stroke="#202124" stroke-width="2"/><path d="M300,240 L300,298.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M800,240 L800,298.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M1300,240 L1300,298.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><rect x="160.0" y="562.0" width="280" height="96" rx="16" fill="#FFD8A8" stroke="#E8590C" stroke-width="2.2"/><text x="300" y="594" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">NVIDIA SimReady search</text><text x="300" y="616" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">tool the architect calls</text><text x="300" y="638" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">to pick real 3D assets</text><path d="M300,442.0 L300,558" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="304.3" y="486.0" width="87.4" height="19" fill="#fff"/><text x="348.0" y="500.0" text-anchor="middle" font-size="16" fill="#202124">tool call</text><path d="M800,440.0 V540 M604.0,540 H996.0" fill="none" stroke="#202124" stroke-width="2"/><path d="M604.0,540 L604.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M660.0,540 L660.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M716.0,540 L716.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M772.0,540 L772.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M828.0,540 L828.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M884.0,540 L884.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M940.0,540 L940.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M996.0,540 L996.0,557.0" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><rect x="581.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="604.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 1</text><rect x="637.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="660.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 2</text><rect x="693.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="716.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 3</text><rect x="749.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="772.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 4</text><rect x="805.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="828.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 5</text><rect x="861.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="884.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 6</text><rect x="917.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="940.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 7</text><rect x="973.0" y="560.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="996.0" y="585" text-anchor="middle" font-size="13" fill="#202124">ER 8</text><rect x="581.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="604.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 9</text><rect x="637.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="660.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 10</text><rect x="693.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="716.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 11</text><rect x="749.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="772.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 12</text><rect x="805.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="828.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 13</text><rect x="861.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="884.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 14</text><rect x="917.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="940.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 15</text><rect x="973.0" y="610.0" width="46" height="40" rx="8" fill="#E5DBFF" stroke="#7048E8" stroke-width="1.6"/><text x="996.0" y="635" text-anchor="middle" font-size="13" fill="#202124">ER 16</text><text x="800" y="682" text-anchor="middle" font-size="15" fill="#343A40">16 Robotics-ER agents, 8 frames each, all at once</text><rect x="1115.0" y="562.0" width="160" height="96" rx="16" fill="#E5DBFF" stroke="#7048E8" stroke-width="2.2"/><text x="1195" y="594" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">Round 1</text><text x="1195" y="616" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">scene edits +</text><text x="1195" y="638" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">policy patch</text><rect x="1325.0" y="562.0" width="160" height="96" rx="16" fill="#E5DBFF" stroke="#7048E8" stroke-width="2.2"/><text x="1405" y="594" text-anchor="middle" font-size="18" font-weight="600" fill="#202124">Round 2</text><text x="1405" y="616" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">sees why round 1</text><text x="1405" y="638" text-anchor="middle" font-size="15" font-weight="400" fill="#343A40">was not kept</text><path d="M1300,440.0 V534 M1195,534 H1405" fill="none" stroke="#202124" stroke-width="2"/><path d="M1195,534 L1195,558" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M1405,534 L1405,558" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><path d="M1277,610 L1321,610" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#head)"/><text x="800.0" y="732" text-anchor="middle" font-size="16" fill="#5F6368">Phase 2 starts as soon as Phase 1 returns. Every result is checked against its contract and scored before the next phase uses it.</text></svg>