name: Deploy the batting cage to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the MuJoCo WebAssembly build (not kept in git)
        run: |
          mkdir -p web/vendor
          curl -sfL -o web/vendor/mujoco.js https://cdn.jsdelivr.net/npm/@mujoco/mujoco@3.16.0/mujoco.js
          curl -sfL -o web/vendor/mujoco.wasm https://cdn.jsdelivr.net/npm/@mujoco/mujoco@3.16.0/mujoco.wasm
          ls -la web web/vendor web/assets
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
