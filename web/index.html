<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldGym Batting Cage</title>
<meta name="description" content="A Unitree G1 humanoid swings a youth wood bat at machine pitches, with MuJoCo running in your browser. The swing is reconstructed from a real batter's video.">
<style>
  /* Night game. The field is the page; controls float on liquid glass. */
  :root {
    --night: #070d0a;
    /* liquid glass: the ritik.io toolbar's dark-theme values */
    --glass-bg: rgba(23, 22, 26, 0.45);
    --glass-stroke: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.16);
    --glass-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 45%);
    --glass-lift: 0 22px 60px -12px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.35);
    --glass-blur: 30px;
    --glass-saturate: 180%;
    --glass-active: rgba(42, 41, 47, 0.65);
    --ink: #f4f6f2;
    --ink-dim: rgba(244, 246, 242, 0.62);
    --ball: #ffb43a;
    --good: #9ef0a4;
    --bad: #ff9a85;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--ink); font-family: var(--font); overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .glass {
    position: relative; background: var(--glass-bg);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    box-shadow: var(--glass-lift), inset 0 1px 0 var(--glass-highlight), inset 0 0 0 1px var(--glass-stroke);
  }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: var(--glass-shine); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ball); outline-offset: 3px; }
  svg { display: block; }

  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 999px;
    max-width: calc(100vw - 32px);
  }
  .zone { display: grid; grid-template-columns: repeat(3, 13px); gap: 3px; padding: 6px; border-radius: 14px;
          background: rgba(255, 255, 255, 0.05); }
  .zone button { width: 13px; height: 13px; border-radius: 4px; background: rgba(255, 255, 255, 0.16); }
  .zone button[aria-pressed="true"] { background: var(--ball); box-shadow: 0 0 10px rgba(255, 180, 58, 0.7); }
  .speed { display: flex; align-items: center; gap: 6px; }
  .speed button { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, 0.08);
                  display: grid; place-items: center; }
  .speed output { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600;
                  font-size: 19px; letter-spacing: -0.01em; }
  .speed output small { font-size: 11px; font-weight: 500; color: var(--ink-dim); margin-left: 2px; }
  #pitch { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
           background: radial-gradient(circle at 35% 30%, #fff9ec, #f1e6cf 55%, #d9c8a6);
           box-shadow: inset 0 -3px 8px rgba(0, 0, 0, 0.25), 0 6px 22px rgba(255, 190, 90, 0.35);
           transition: transform 0.12s ease; }
  #pitch:active { transform: scale(0.94); }
  #pitch:disabled { filter: grayscale(0.7) brightness(0.7); cursor: wait; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
              background: transparent; color: var(--ink-dim); }
  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .icon-btn[aria-pressed="true"] { background: var(--glass-active); color: var(--ball); box-shadow: inset 0 0 0 1px var(--glass-stroke); }

  .cams { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
          display: grid; gap: 8px; padding: 8px; border-radius: 26px; }
  .info { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
          width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink);
          text-decoration: none; font-weight: 600; font-size: 17px; }
  .tally { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
           display: flex; gap: 14px; padding: 9px 16px; border-radius: 999px; font-variant-numeric: tabular-nums;
           font-size: 14px; font-weight: 600; }
  .tally span { display: flex; align-items: baseline; gap: 5px; }
  .tally small { font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; color: var(--ink-dim); }

  .hud { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px);
         display: flex; align-items: center; gap: 18px; padding: 12px 22px; border-radius: 999px;
         opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease; pointer-events: none; }
  .hud.show { opacity: 1; transform: translate(-50%, 0); }
  .hud .word { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .hud .word.good { color: var(--good); }
  .hud .word.bad { color: var(--bad); }
  .hud .nums { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .hud .n { display: grid; gap: 1px; text-align: center; }
  .hud .n b { font-size: 18px; font-weight: 650; }
  .hud .n small { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); }
  #loading .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.12);
                   border-top-color: var(--ball); animation: spin 0.9s linear infinite; }
  #loading p { position: absolute; top: calc(50% + 40px); color: var(--ink-dim); font-size: 13px; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .dock { gap: 9px; padding: 8px 10px; }
    #pitch { width: 54px; height: 54px; }
    .speed output { min-width: 50px; font-size: 17px; }
    .cams { top: auto; transform: none; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); grid-auto-flow: column; }
    .hud { gap: 12px; padding: 10px 16px; max-width: calc(100vw - 32px); }
    .hud .word { font-size: 18px; }
    .tally { top: calc(70px + env(safe-area-inset-top, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .hud, #pitch { transition: none; } #loading .ring { animation: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading"><div class="ring" aria-hidden="true"></div><p id="load-msg">Loading physics</p></div>

<div class="tally glass" id="tally" aria-label="Count, outs and hits">
  <span><b id="t-count">0-0</b><small>COUNT</small></span>
  <span><b id="t-outs">0</b><small>OUT</small></span>
  <span><b id="t-h">0</b><small>H</small></span>
  <span><b id="t-hr">0</b><small>HR</small></span>
</div>

<div class="hud glass show" id="hud" aria-live="polite">
  <span class="word" id="h-word">–</span>
  <div class="nums">
    <div class="n"><b id="h-exit">–</b><small>EV MPH</small></div>
    <div class="n"><b id="h-la">–</b><small>LA</small></div>
    <div class="n"><b id="h-dist">–</b><small>M</small></div>
    <div class="n"><b id="h-call">–</b><small>CALL</small></div>
  </div>
</div>

<a class="info glass" href="info/" aria-label="How we built it">i</a>

<nav class="cams glass" id="cams" aria-label="Camera">
  <button class="icon-btn" data-cam="machine" aria-pressed="true" title="Behind the machine" aria-label="Behind the machine">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="9" r="4"/><circle cx="16" cy="9" r="4"/><path d="M12 13v8M7 21l5-8 5 8"/></svg>
  </button>
  <button class="icon-btn" data-cam="catcher" aria-pressed="false" title="Behind the plate" aria-label="Behind the plate">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9a8 8 0 0 1 16 0v4a8 8 0 0 1-16 0z"/><path d="M4 12h16M9 5v14M15 5v14"/></svg>
  </button>
  <button class="icon-btn" data-cam="side" aria-pressed="false" title="Side" aria-label="Side view">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg>
  </button>
  <button class="icon-btn" data-cam="top" aria-pressed="false" title="Overhead" aria-label="Overhead view">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 9-9 9-9-9z"/><circle cx="12" cy="12" r="2"/></svg>
  </button>
</nav>

<div class="dock glass" role="toolbar" aria-label="Pitch controls">
  <div class="zone" id="zone" role="group" aria-label="Pitch location"></div>
  <div class="speed">
    <button id="slower" aria-label="Slower pitch"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg></button>
    <output id="speed-out" aria-label="Pitch speed">45<small>mph</small></output>
    <button id="faster" aria-label="Faster pitch"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>
  <button id="pitch" disabled aria-label="Pitch">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#c4312b" stroke-width="1.6" stroke-linecap="round">
      <path d="M11 6c4 4 4 24 0 28" /><path d="M29 6c-4 4-4 24 0 28" />
      <path d="M10.5 11l2.4-.8M11.6 15l2.5-.4M12 20h2.5M11.6 25l2.5.4M10.5 29l2.4.8"/>
      <path d="M29.5 11l-2.4-.8M28.4 15l-2.5-.4M28 20h-2.5M28.4 25l-2.5.4M29.5 29l-2.4.8"/>
    </svg>
  </button>
  <button class="icon-btn" id="brain" aria-pressed="false" title="Trained policy (physics)" aria-label="Trained policy" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/><rect x="10" y="10" width="4" height="4"/></svg>
  </button>
  <button class="icon-btn" id="auto" aria-pressed="false" title="Auto pitch" aria-label="Auto pitch">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
  </button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- physical constants ----------
const BALL_R = 0.0366, BALL_M = 0.145;             // regulation baseball
const AIR = 1.225, CD = 0.35;                     // air density, baseball drag coefficient
const COR = 0.50;                                 // wood bat on ball
const DT = 0.002;                                 // physics step (s)
// Little League field: the G1 is Little League sized (1.3 m)
const MOUND_M = 14.02;                            // pitching distance, 46 ft
const BASE_M = 18.29;                             // base paths, 60 ft
const FENCE_M = 61.0, FENCE_H = 1.8;              // outfield wall, 200 ft
const RELEASE_Z = 1.02;                           // the machine's wheel gap
const MPH = 0.44704;

const $ = (id) => document.getElementById(id);
const loadMsg = $("load-msg");

// ---------- load physics, meshes, swing ----------
const get = (u) => fetch(u, { cache: "no-cache" });
const [xml, vis, sw] = await Promise.all([
  get("assets/cage.xml").then((r) => r.text()),
  get("assets/visuals.json").then((r) => r.json()),
  get("assets/swing.json").then((r) => r.json()),
]);
const bin = Uint8Array.from(atob(vis.blob), (ch) => ch.charCodeAt(0)).buffer;   // float32 positions, then uint32 indices
const f32 = (b64) => new Float32Array(Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0)).buffer);
// the RL tracking policy: observation normaliser + actor MLP (ELU), run in plain JS at 50 Hz
const policy = await get("assets/policy.json").then((r) => r.ok ? r.json() : null).catch(() => null);
if (policy) {
  const mean = f32(policy.mean), vari = f32(policy.var);
  const layers = policy.layers.map((l) => ({ n: l.in, m: l.out, W: f32(l.W), b: f32(l.b) }));
  policy.act = (obs) => {
    let x = new Float32Array(obs.length);
    for (let i = 0; i < obs.length; i++) x[i] = Math.max(-5, Math.min(5, (obs[i] - mean[i]) / Math.sqrt(vari[i] + 1e-2)));
    layers.forEach((L, li) => {
      const y = new Float32Array(L.m), last = li === layers.length - 1;
      for (let o = 0; o < L.m; o++) {
        let acc = L.b[o];
        for (let i = 0, r = o * L.n; i < L.n; i++) acc += L.W[r + i] * x[i];
        y[o] = last ? acc : acc > 0 ? acc : Math.expm1(acc);
      }
      x = y;
    });
    return x;
  };
  const a = policy.act(policy.test_obs);
  policy.parity = Math.max(...a.map((v, i) => Math.abs(v - policy.test_action[i])));   // vs PyTorch on the same obs
}
let mj;
try {
  const wasm = await (await get("vendor/mujoco.wasm")).arrayBuffer();
  const { default: loadMujoco } = await import("./vendor/mujoco.js");
  mj = await loadMujoco({ wasmBinary: wasm });
} catch (e) {
  loadMsg.textContent = "This browser could not start the physics engine: " + (e.message || e);
  throw e;
}
const model = mj.MjModel.from_xml_string(xml);
const data = new mj.MjData(model);
model.opt.timestep = DT;
const BODY = mj.mjtObj.mjOBJ_BODY.value;
const bodyId = (n) => mj.mj_name2id(model, BODY, n);
const NQ_ROBOT = sw.nq;
const ballBody = bodyId("ball");
const batBody = bodyId("bat");
const ballQ = NQ_ROBOT, ballV = NQ_ROBOT - 1;       // ball free joint follows the robot's joints
const swingQ = new Float64Array(sw.qpos);
const T_CONTACT = sw.contact_frame / sw.hz;
const toP = new THREE.Vector3(...sw.to_pitcher);    // MuJoCo frame (z up), from the plate toward the machine
const side = new THREE.Vector3(-toP.y, toP.x, 0);
const contact = new THREE.Vector3(...sw.sweet_spot);
const plate = new THREE.Vector3(contact.x, contact.y, 0).addScaledVector(toP, -0.25);
const mound = plate.clone().addScaledVector(toP, MOUND_M);
const release = mound.clone().addScaledVector(toP, -0.26).setZ(RELEASE_Z);
const capsules = sw.bat.capsules;                   // [z0, z1, r] along the bat's +z

// ---------- scene: MuJoCo is z-up; one root group turns it into three's y-up ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
$("stage").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#070d0a");
scene.fog = new THREE.Fog("#070d0a", 45, 120);
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);
const camera = new THREE.PerspectiveCamera(20, 1, 0.1, 300);
{ // night sky: deep blue at the zenith fading to the stadium haze at the horizon
  const c = document.createElement("canvas"); c.width = 2; c.height = 256;
  const g = c.getContext("2d"), grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#05080f"); grad.addColorStop(0.62, "#0c1626"); grad.addColorStop(1, "#1b2b2a");
  g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
  scene.background = new THREE.CanvasTexture(c);
  scene.fog.color.set("#13201f");
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight("#cfe3ff", "#14261a", 0.4));
const key = new THREE.DirectionalLight("#fff3d6", 1.7);            // light tower behind first base
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 30 });
scene.add(key);
scene.add(key.target);
const rim = new THREE.DirectionalLight("#a9c8ff", 0.7);
scene.add(rim);

const ang = Math.atan2(toP.y, toP.x);
function stripes() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const g = c.getContext("2d");
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? "#285a33" : "#2e6539"; g.fillRect(0, i * 64, 1024, 64); }
  return new THREE.CanvasTexture(c);
}
// field geometry in the plate frame: u along the pitch line (toward center field), v toward third base
const at = (u, v, z = 0) => plate.clone().addScaledVector(toP, u).addScaledVector(side, v).setZ(z);
const flat = (geo, mat, p, rot = 0, z = 0.001) => {
  const m = new THREE.Mesh(geo, mat); m.position.set(p.x, p.y, z); m.rotation.z = rot; m.receiveShadow = true; world.add(m); return m;
};
const clay = new THREE.MeshStandardMaterial({ color: "#8f6040", roughness: 1 });
const infieldGrass = new THREE.MeshStandardMaterial({ color: "#2b6136", roughness: 0.95 });
const chalk = new THREE.MeshBasicMaterial({ color: "#efeadf" });
flat(new THREE.CircleGeometry(FENCE_M + 6, 128), new THREE.MeshStandardMaterial({ map: stripes(), roughness: 0.95 }), plate, ang, 0.0);
// warning track and infield skin: dirt fans out from home plate across fair territory
flat(new THREE.RingGeometry(FENCE_M - 3.0, FENCE_M + 0.2, 96, 1, ang - Math.PI / 4 - 0.02, Math.PI / 2 + 0.04), clay, plate, 0, 0.012);
flat(new THREE.CircleGeometry(MOUND_M + 15.24, 96, ang - Math.PI / 4 - 0.12, Math.PI / 2 + 0.24), clay, plate, 0, 0.010);
// infield grass: the square inside the base paths, inset by the 3 ft dirt base path
const diamond = new THREE.Shape();
const dg = (BASE_M - 0.9) / Math.SQRT2;
diamond.moveTo(1.6, 0); diamond.lineTo(dg + 0.4, dg - 1.2); diamond.lineTo(2 * dg - 0.6, 0); diamond.lineTo(dg + 0.4, -(dg - 1.2)); diamond.closePath();
flat(new THREE.ShapeGeometry(diamond), infieldGrass, plate, ang, 0.020);
flat(new THREE.CircleGeometry(2.74, 64), clay, mound, 0, 0.030);                 // pitcher's mound, 18 ft circle
flat(new THREE.CircleGeometry(3.05, 64), clay, plate, 0, 0.030);                 // home plate circle
const rubber = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.46, 0.02), chalk);
rubber.position.set(mound.x, mound.y, 0.08); rubber.rotation.z = ang; world.add(rubber);
const moundHill = new THREE.Mesh(new THREE.SphereGeometry(2.6, 32, 12, 0, Math.PI * 2, 0, 0.22), clay);
moundHill.rotation.x = Math.PI / 2; moundHill.position.set(mound.x, mound.y, -2.54); moundHill.receiveShadow = true; world.add(moundHill);
// bases: 1B to the right of the pitch line seen from home, 3B to the left, 2B straight out
const bag = new THREE.MeshStandardMaterial({ color: "#f6f3ec", roughness: 0.7 });
for (const [u, v] of [[BASE_M / Math.SQRT2, -BASE_M / Math.SQRT2], [BASE_M * Math.SQRT2, 0], [BASE_M / Math.SQRT2, BASE_M / Math.SQRT2]]) {
  const p = at(u, v);
  flat(new THREE.CircleGeometry(1.4, 32), clay, p, 0, 0.028);
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.06), bag); b.position.set(p.x, p.y, 0.03); b.rotation.z = ang + Math.PI / 4; b.castShadow = true; world.add(b);
}
for (const s of [-1, 1]) {                            // foul lines out to the poles
  const a = ang + s * Math.PI / 4, L = FENCE_M;
  flat(new THREE.PlaneGeometry(L, 0.07), chalk, plate.clone().add(new THREE.Vector3(Math.cos(a) * L / 2, Math.sin(a) * L / 2, 0)), a, 0.04);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 9, 12), new THREE.MeshStandardMaterial({ color: "#ffd23a", emissive: "#5a4a00" }));
  pole.rotation.x = Math.PI / 2; pole.position.set(plate.x + Math.cos(a) * FENCE_M, plate.y + Math.sin(a) * FENCE_M, 4.5); world.add(pole);
}
const box = (len, w, p, rot) => flat(new THREE.PlaneGeometry(len, w), chalk, p, rot, 0.04);
for (const sgn of [-1, 1]) {                          // Little League batter's boxes: 3 x 6 ft, 6 in off the plate, 3 in chalk
  const c = at(0, sgn * (0.2159 + 0.1524 + 0.4572));
  for (const dv of [-0.4572, 0.4572]) box(1.83, 0.076, c.clone().addScaledVector(side, dv), ang);
  for (const du of [-0.9144, 0.9144]) box(0.99, 0.076, c.clone().addScaledVector(toP, du), ang + Math.PI / 2);
}
// home plate: 17 in across the front, 8.5 in sides, 12 in edges to the point; its midpoint sits on `plate`
const plateShape = new THREE.Shape([[0.2159, -0.2159], [0.2159, 0.2159], [0, 0.2159], [-0.2159, 0], [0, -0.2159]].map(([u, v]) => new THREE.Vector2(u, v)));

// ---------- trained policy: observation exactly as in humanoid/track_env.py ----------
const pol = { on: false, t: 0, k: 0, last: new Float32Array(policy ? policy.act_dim : 0), hold: null };
// training episodes end 1 s after the follow-through; the policy balances for half of that, then the robot is held still
const POLICY_END_PAD = 25;
let polContact = contact, polContactT = T_CONTACT;    // where and when the policy's own bat meets the ball (measured below)
let policyMode = !!policy;                            // the trained policy bats by default when its weights loaded
function policyObs(t) {

  const P = policy, T = P.frames, n = NQ_ROBOT, q = data.qpos, v = data.qvel, xm = data.xmat, b = bodyId("pelvis") * 9;
  const o = new Float32Array(P.obs_dim);

  o[k++] = -xm[b + 6]; o[k++] = -xm[b + 7]; o[k++] = -xm[b + 8];          // gravity in the pelvis frame
  o[k++] = v[3] * 0.25; o[k++] = v[4] * 0.25; o[k++] = v[5] * 0.25;        // pelvis angular velocity
  const tr = Math.min(t, T - 1), tn = Math.min(t + 1, T - 1);

  for (const j of P.vadr) o[k++] = v[j] * 0.1;

  const ph = 2 * Math.PI * tr / T; o[k++] = Math.sin(ph); o[k++] = Math.cos(ph);

function policyStep() {                               // one physics step of the policy-driven swing
  const P = policy, n = NQ_ROBOT, sub = Math.round(1 / (P.ctrl_hz * DT));

    setSwing(0); data.qacc_warmstart.fill(0); pol.on = true; pol.t = 0; pol.k = 0; pol.last.fill(0); pol.hold = null;
  }
  if (pol.t >= P.frames - 1 - POLICY_END_PAD) {          // its episode is over: hold the robot where the policy left it
    if (!pol.hold) pol.hold = Float64Array.from(data.qpos.subarray(0, n));
    data.qpos.set(pol.hold); for (let j = 0; j < n - 1; j++) data.qvel[j] = 0;
    pol.k++; return;
  }
  if (pol.k % sub === 0) {
    const a = P.act(policyObs(pol.t)).map((x) => Math.max(-3, Math.min(3, x)));
    pol.last.set(a);

    for (let i = 0; i < P.act_dim; i++)
      data.ctrl[i] = Math.max(P.lo[i], Math.min(P.hi[i], swingQ[tn * n + P.jadr[i]] + P.action_scale * a[i]));
  }

// ---------- robot pose from the swing ----------
function setSwing(t) {
  const f = Math.max(0, Math.min(sw.frames - 1.001, t * sw.hz));
  const i = Math.floor(f), a = f - i, n = NQ_ROBOT, q = data.qpos;
  for (let j = 0; j < n; j++) q[j] = swingQ[i * n + j] * (1 - a) + swingQ[(i + 1) * n + j] * a;
  let norm = 0;
  for (let j = 3; j < 7; j++) norm += q[j] * q[j];
  norm = Math.sqrt(norm);
  for (let j = 3; j < 7; j++) q[j] /= norm;
  const v = data.qvel;
  for (let j = 0; j < NQ_ROBOT - 1; j++) v[j] = 0;
}

// ---------- ball flight ----------
function placeBall(p, v) {
  const q = data.qpos, w = data.qvel;
  q[ballQ] = p.x; q[ballQ + 1] = p.y; q[ballQ + 2] = p.z; q[ballQ + 3] = 1; q[ballQ + 4] = 0; q[ballQ + 5] = 0; q[ballQ + 6] = 0;
  w[ballV] = v.x; w[ballV + 1] = v.y; w[ballV + 2] = v.z; w[ballV + 3] = 0; w[ballV + 4] = 0; w[ballV + 5] = 0;
}
const ballPos = () => new THREE.Vector3(data.qpos[ballQ], data.qpos[ballQ + 1], data.qpos[ballQ + 2]);
const ballVel = () => new THREE.Vector3(data.qvel[ballV], data.qvel[ballV + 1], data.qvel[ballV + 2]);

  const p = from.clone(), v = v0.clone();

    v.add(new THREE.Vector3(0, 0, -9.81).add(drag(v)).multiplyScalar(DT));

  const aimAt = target.clone();

    const hit = fly(from, v, target);

    if (err.length() < 0.003) break;

  const N = Math.max(1, Math.round(h / 0.0005));
  for (let i = 1; i <= N; i++) {
    const f = { p: prev.p.clone().lerp(now.p, i / N), q: prev.q.clone().slerp(now.q, i / N) };
    const b = bp.clone().addScaledVector(bv, -h * (1 - i / N));

      const a = local(f, z0), ab = local(f, z1).sub(a);

      bp.copy(c).addScaledVector(n, r + BALL_R + 0.001);

  pol.on = false; model.opt.timestep = DT; setSwing(0); placeBall(PARK, new THREE.Vector3()); mj.mj_forward(model, data);
}

const SWING_WINDOW = { up: 0.13, lat: 0.12 };          // how far from its hitting spot the robot will still swing
function pitch() {
  if (sim.phase === "pitch" || sim.phase === "flight" || sim.phase === "batted") return;
  const speed = mph * MPH;
  const row = Math.floor(zoneSel / 3), col = zoneSel % 3;
  const hand = sw.top_hand === "left" ? -1 : 1;
  const zoneH = SZ.top - SZ.bot;
  // middle row: where this swing meets the ball; top row a touch above it; low row: the strike zone, which it takes
  const usePolicy = policyMode && policy, hit = usePolicy ? polContact : contact, tHit = usePolicy ? polContactT : T_CONTACT;
  const z = [hit.z + 0.04, hit.z, (SZ.top + SZ.bot) / 2][row];
  // columns as seen from behind the machine: away (a ball), middle, inside (toward the batter, still a strike)
  const lat = row < 2 ? (col - 1) * 0.06 * hand : [-0.32, 0, 0.12][col] * hand;
  // the swing rows are aimed where the bat meets the ball, the low row at the zone itself (the plate's midpoint)
  const target = plate.clone().addScaledVector(toP, row < 2 ? hit.clone().sub(plate).dot(toP) : zoneU).addScaledVector(side, lat + (row < 2 ? hit.clone().sub(plate).dot(side) : 0)).setZ(z)
    .add(new THREE.Vector3(noise(0.015), noise(0.015), noise(0.015)));     // the machine scatters about 1.5 cm
  const { v, T } = aim(release, target, speed);
  const reach = Math.abs(target.z - hit.z) <= SWING_WINDOW.up && Math.abs(target.clone().sub(hit).dot(side)) <= SWING_WINDOW.lat;
  const lead = Math.max(0.35, tHit - T + 0.2);
  sim = { t: 0, launchAt: lead, swingAt: reach ? lead + T - tHit + noise(TIMING_SD) : Infinity, phase: "pitch",
          contact: null, landed: false, v, crossed: null, strike: false, swung: reach };
  $("pitch").disabled = true;
  pitchDot.visible = false;
  trailN = 0; trailGeo.setDrawRange(0, 0);
  if (camMode === "machine") setCam("machine", false);
}
$("pitch").addEventListener("click", pitch);
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); pitch(); } });
$("brain").disabled = !policy;
$("brain").setAttribute("aria-pressed", String(policyMode));
$("brain").addEventListener("click", () => {
  policyMode = !policyMode; $("brain").setAttribute("aria-pressed", String(policyMode));
});
let autoTimer = 0;
$("auto").addEventListener("click", () => {
  const on = $("auto").getAttribute("aria-pressed") !== "true";
  $("auto").setAttribute("aria-pressed", String(on));
  if (on && sim.phase !== "pitch" && sim.phase !== "flight" && sim.phase !== "batted") pitch();
});
function finish(word, kind, nums) {
  hud(word, kind, nums); drawTally(); sim.phase = "done";
  setTimeout(() => { if (sim.phase === "done" && camMode === "machine") setCam("machine", false); }, 2200);
  setTimeout(() => { $("pitch").disabled = false; }, 500);
  clearTimeout(autoTimer);
  if ($("auto").getAttribute("aria-pressed") === "true") autoTimer = setTimeout(pitch, 2600);
}

function step() {
  const prev = batFrame();
  sim.t += DT;
  if (policyMode && policy && sim.t >= sim.swingAt) policyStep();
  else { pol.on = false; setSwing(Math.max(0, sim.t - sim.swingAt)); }
  if (sim.phase === "pitch" && sim.t >= sim.launchAt) { placeBall(release, sim.v); sim.phase = "flight"; wheelSpin = 60; }
  if (sim.phase === "idle" || sim.phase === "pitch" || sim.gone) { placeBall(PARK, new THREE.Vector3()); }
  else if (sim.phase === "flight" || sim.phase === "batted" || sim.phase === "tipped") {
    const f = drag(ballVel()).multiplyScalar(BALL_M);
    data.xfrc_applied[ballBody * 6] = f.x; data.xfrc_applied[ballBody * 6 + 1] = f.y; data.xfrc_applied[ballBody * 6 + 2] = f.z;
  }
  // the policy was trained on 4 ms physics steps: while it drives the robot, every other call takes one step twice as long
  const h = pol.on ? 2 * DT : DT;
  if (pol.on && pol.k % 2 === 0) return;
  model.opt.timestep = h;
  mj.mj_step(model, data);
  if (sim.phase !== "flight" && sim.phase !== "batted" && sim.phase !== "tipped") return;
  const now = batFrame(), bp = ballPos(), bv = ballVel();
  const u = bp.clone().sub(plate).dot(toP);
  if (!sim.crossed && u <= zoneU) { sim.crossed = bp.clone(); sim.strike = callPitch(bp); }
  const call = () => sim.strike ? "S" : "B";
  if (sim.phase === "flight") {
    const out = sim.swung ? collide(prev, now, bp, bv, h) : null;
    if (out && out.dot(toP) > 0) {                      // in play
      placeBall(bp, out);
      const s = out.length(), launch = Math.atan2(out.z, Math.hypot(out.x, out.y)) * 180 / Math.PI;
      sim.contact = { s, launch }; sim.phase = "batted"; trailN = 0;
    } else if (out) {                                   // tipped back: a foul
      placeBall(bp, out); sim.phase = "tipped";
    } else if (!sim.swung && hitsBatter(bp)) {
      gone(); finish(atBat("hbp") || "Hit by pitch", "good", ["–", "–", "–", "HBP"]);
    } else if (u <= zoneU) {                            // past the zone untouched: called or missed, and out of play
      gone();
      const k = sim.swung || sim.strike ? atBat("strike") : atBat("ball");
      finish(k || (sim.swung ? "Swinging strike" : sim.strike ? "Strike" : "Ball"), sim.swung || sim.strike ? "bad" : "good",
             ["–", "–", "–", sim.swung ? "S" : call()]);
    }
  } else if (sim.phase === "tipped") {
    if (u <= zoneU || bp.z < 0.1) { gone(); atBat("foul"); finish("Foul", "bad", ["–", "–", "–", "S"]); }
  } else {
    const rel = bp.clone().sub(plate), d = Math.hypot(rel.x, rel.y);
    const off = Math.abs(Math.atan2(toP.x * rel.y - toP.y * rel.x, rel.x * toP.x + rel.y * toP.y)) * 180 / Math.PI;
    const nums = () => [(sim.contact.s / MPH).toFixed(0), `${sim.contact.launch.toFixed(0)}°`, d.toFixed(1), call()];
    if (!sim.landed && d >= FENCE_M && bp.z > FENCE_H && off <= 45) {
      sim.landed = true; tally.hr++; tally.h++; atBat("inplay"); finish("Home run", "good", nums());
    } else if (!sim.landed && bp.z <= BALL_R + 0.005 && bv.z <= 0) {
      sim.landed = true;
      if (off > 45 || rel.dot(toP) < 0) { atBat("foul"); finish("Foul", "bad", nums()); }
      else {
        tally.h++; atBat("inplay");
        const L = sim.contact.launch;
        finish(L < 10 ? "Ground ball" : L < 25 ? "Line drive" : L < 50 ? "Fly ball" : "Pop up", "good", nums());
      }
    }
  }
}
function gone() { sim.gone = true; placeBall(PARK, new THREE.Vector3()); }    // no catcher: the ball leaves play at the zone
// the count: four balls walk, three strikes are out (a foul is a strike until there are two), three outs retire the side
function atBat(kind) {
  let end = "";
  if (kind === "ball" && ++count.b === 4) end = "Walk";
  if (kind === "strike" && ++count.s === 3) { end = "Strikeout"; count.outs++; }
  if (kind === "foul" && count.s < 2) count.s++;
  if (kind === "hbp") end = "Hit by pitch";
  if (end || kind === "inplay") { count.b = 0; count.s = 0; }
  if (count.outs === 3) { count.outs = 0; end += ", side retired"; }
  drawTally();
  return end;
}
// hit by pitch: the ball against the robot's limbs and trunk, as capsules between joint frames
const HBP_SEGS = [["pelvis", "torso_link", 0.12], ["left_hip_pitch_link", "left_knee_link", 0.07], ["left_knee_link", "left_ankle_roll_link", 0.06],
  ["right_hip_pitch_link", "right_knee_link", 0.07], ["right_knee_link", "right_ankle_roll_link", 0.06],
  ["left_shoulder_roll_link", "left_elbow_link", 0.05], ["left_elbow_link", "left_wrist_yaw_link", 0.045],
  ["right_shoulder_roll_link", "right_elbow_link", 0.05], ["right_elbow_link", "right_wrist_yaw_link", 0.045]].map(([a, b, r]) => [bodyId(a), bodyId(b), r]);
const torsoId = bodyId("torso_link");
function hitsBatter(bp) {
  const P = (i) => new THREE.Vector3(data.xpos[i * 3], data.xpos[i * 3 + 1], data.xpos[i * 3 + 2]);
  const near = (a, b, r) => { const ab = b.clone().sub(a), t = Math.max(0, Math.min(1, bp.clone().sub(a).dot(ab) / ab.lengthSq()));
                              return a.clone().addScaledVector(ab, t).distanceTo(bp) < r + BALL_R; };
  const t = P(torsoId), up = new THREE.Vector3(data.xmat[torsoId * 9 + 2], data.xmat[torsoId * 9 + 5], data.xmat[torsoId * 9 + 8]);
  return near(t, t.clone().addScaledVector(up, 0.42), 0.11) || HBP_SEGS.some(([a, b, r]) => near(P(a), P(b), r));
}

// ---------- render loop ----------
let last = performance.now(), acc = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  acc += dt; last = now;
  while (acc >= DT) { step(); acc -= DT; }
  wheelSpin += (8 - wheelSpin) * Math.min(1, dt * 1.5);
  for (const w of wheels) w.rotation.z += w.userData.dir * wheelSpin * dt;
  mj.mj_kinematics(model, data);
  for (const b of bodies) {
    const i = b.id;
    b.mesh.position.set(data.xpos[i * 3], data.xpos[i * 3 + 1], data.xpos[i * 3 + 2]);
    b.mesh.quaternion.set(data.xquat[i * 4 + 1], data.xquat[i * 4 + 2], data.xquat[i * 4 + 3], data.xquat[i * 4]);
  }
  const bp = ballPos();
  ball.position.copy(bp);
  if (sim.phase === "batted") followBall(bp);
  directCamera(dt);
  if (sim.phase !== "idle" && sim.phase !== "pitch" && !sim.gone && bp.z > -1 && bp.z < PARK.z - 1 && trailN < TRAIL) {
    trailPts.set([bp.x, bp.y, bp.z], trailN * 3); trailN++;
    trailGeo.setDrawRange(0, trailN); trailGeo.attributes.position.needsUpdate = true;
  }
  if (!director) controls.update();
  renderer.render(scene, camera);
}
function frame(now) {
  try { tick(now); } catch (e) { loadMsg.textContent = "Simulation stopped: " + (e.message || e); $("loading").hidden = false; console.error(e); return; }
  requestAnimationFrame(frame);
}
// test hook: step the physics directly (a background tab gets no animation frames)
window.cage = { get sim() { return sim; }, get parity() { return policy && policy.parity; }, setPolicy: (on) => { policyMode = on; }, pitch, setNoise: (on) => { noiseOn = on; }, setCam, pelvisZ: () => data.qpos[2], polContact: () => [polContact.toArray(), polContactT], setSpeed: (v) => { mph = v; showSpeed(); },
                advance: (sec) => { for (let k = 0; k < sec / DT; k++) step(); last = performance.now(); tick(last); return $("h-word").textContent; } };
$("loading").hidden = true;
$("pitch").disabled = false;
drawTally();
requestAnimationFrame(frame);
</script>
</body>
</html>
